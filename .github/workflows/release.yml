# Publishes a release whenever a version tag is pushed:
#
#   1. bump `version` in Cargo.toml (e.g. 0.1.1) and commit
#   2. tag that commit v0.1.1 and push (GitHub Desktop pushes annotated tags
#      along with the commits; or: git push origin main v0.1.1)
#
# Windows: the MSVC build links the C runtime and the WebView2 loader
# statically, so the folder is just KittyConnect.exe, Start KittyConnect.bat
# and licenses. The official tailcat.exe (hash-pinned) and kc-voip.exe, built
# here from voip-helper/ on the same TailCat version, are embedded in the exe.
#
# macOS: one universal app (Apple Silicon and Intel). TailCat publishes no Mac
# build, so both TailCat programs are built here from source at the same
# version (tools/build-tailcat-macos.sh) and embedded in the app.
#
# The release carries KittyConnect-windows-x64.zip and KittyConnect-macos.zip
# (each the program folder plus a manifest of every file's SHA-256) and a
# .dmg. update.json and update-macos.json on the `updates` branch are how the
# Javacrafter Launcher finds and verifies KittyConnect updates.

name: Release

on:
  push:
    tags: ['v*']

# One release at a time, so two tags pushed together can't race on update.json.
concurrency: release

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        id: version
        shell: pwsh
        run: |
          $tag = '${{ github.ref_name }}'.TrimStart('v')
          $ver = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tag -ne $ver) { throw "Tag v$tag doesn't match Cargo.toml version $ver" }
          "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Fetch TailCat
        shell: pwsh
        run: ./tools/fetch-tailcat.ps1

      - uses: actions/setup-go@v5
        with:
          go-version-file: voip-helper/go.mod
          cache-dependency-path: voip-helper/go.sum

      - name: Test the VOIP helper
        working-directory: voip-helper
        shell: bash
        run: |
          go vet ./...
          go test ./...

      - name: Build the VOIP helper
        shell: pwsh
        run: ./tools/build-voip-helper.ps1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked --target x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --release --locked --target x86_64-pc-windows-msvc

      - name: Assemble the folder
        shell: pwsh
        run: |
          $dir = 'dist/KittyConnect'
          New-Item -ItemType Directory -Force "$dir/licenses" | Out-Null
          Copy-Item target/x86_64-pc-windows-msvc/release/KittyConnect.exe $dir
          Copy-Item 'Start KittyConnect.bat' $dir
          Copy-Item LICENSE-MIT, LICENSE-APACHE "$dir/licenses/"
          Copy-Item vendor/TAILCAT-LICENSE "$dir/licenses/TailCat-LICENSE.txt"
          Copy-Item -Recurse vendor/kc-voip-licenses "$dir/licenses/kc-voip"

      - name: Package
        shell: pwsh
        run: ./tools/release-package.ps1 -Folder dist/KittyConnect -Name KittyConnect -Exe KittyConnect.exe -Version ${{ steps.version.outputs.version }} -Out release

      - uses: actions/upload-artifact@v4
        with:
          name: dist-windows
          path: |
            release/KittyConnect-windows-x64.zip
            release/release-entry.json

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n 1)"
          if [ "$tag" != "$ver" ]; then
            echo "Tag v$tag doesn't match Cargo.toml version $ver" >&2
            exit 1
          fi

      - uses: actions/setup-go@v5
        with:
          go-version-file: voip-helper/go.mod
          cache-dependency-path: voip-helper/go.sum

      - name: Test the VOIP helper
        working-directory: voip-helper
        run: |
          go vet ./...
          go test ./...

      - name: Build both TailCat programs for macOS
        run: ./tools/build-tailcat-macos.sh universal

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build (Apple Silicon and Intel, universal)
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          mkdir -p target/release-universal
          lipo -create -output target/release-universal/KittyConnect \
            target/aarch64-apple-darwin/release/KittyConnect \
            target/x86_64-apple-darwin/release/KittyConnect

      - name: Package
        run: ./tools/package-macos.sh target/release-universal/KittyConnect dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist-macos
          path: |
            dist/KittyConnect-macos.zip
            dist/KittyConnect-macos.dmg
            dist/release-entry-macos.json

  publish:
    needs: [build-windows, build-macos]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: dist-windows
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: dist-macos
          path: dist

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          $pre = if ($tag -match '-') { '--prerelease' } else { $null }
          $assets = @('release/KittyConnect-windows-x64.zip', 'dist/KittyConnect-macos.zip')
          if (Test-Path 'dist/KittyConnect-macos.dmg') { $assets += 'dist/KittyConnect-macos.dmg' }
          gh release create $tag @assets `
            --title "KittyConnect $($tag.TrimStart('v'))" --generate-notes $pre

      # update.json (Windows) and update-macos.json (macOS) live on their own
      # `updates` branch so releases never add commits to main. The launcher
      # reads them from raw.githubusercontent.com.
      - name: Publish update.json and update-macos.json
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag  = '${{ github.ref_name }}'
          $repo = '${{ github.repository }}'
          $info = gh release view $tag --json body,isPrerelease | ConvertFrom-Json
          # Read raw: ConvertFrom-Json would turn the timestamp into a local-format date.
          $published = gh release view $tag --json publishedAt --jq .publishedAt

          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if (git ls-remote --heads origin updates) {
            git fetch --depth 1 origin updates
            git worktree add updates-branch FETCH_HEAD
          } else {
            # First release with update.json: start the branch with nothing else on it.
            git worktree add --detach updates-branch
            git -C updates-branch checkout --orphan updates
            git -C updates-branch rm -rf --quiet .
          }

          ./tools/publish-update.ps1 -Entry release/release-entry.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published $published

          ./tools/publish-update.ps1 -Entry dist/release-entry-macos.json -Repo $repo -Tag $tag `
            -UpdateJson updates-branch/update-macos.json -Prerelease:$info.isPrerelease `
            -Notes "$($info.body)" -Published $published

          git -C updates-branch add update.json update-macos.json
          git -C updates-branch commit -m "update.json and update-macos.json for $tag"
          git -C updates-branch push origin HEAD:refs/heads/updates
