[package]
name = "kittyconnect"
version = "0.5.0"
edition = "2021"
description = "Portable peer-to-peer file sharing and port opening over TailCat."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "KittyConnect"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
arboard = { version = "3", default-features = false }
cpal = "0.16"
base64 = "0.22"
opus1 = "0.3"
nnnoiseless = { version = "0.5.2", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
