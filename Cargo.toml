[package]
name = "kittyconnect"
version = "0.14.0"
edition = "2021"
description = "Portable peer-to-peer file sharing and port opening over TailCat."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "KittyConnect"
path = "src/main.rs"

[dependencies]
tao = "0.37"
wry = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Secrets (a hub or room host's proof, voice keys) from the OS's secure random source.
getrandom = "0.4"
rfd = "0.15"
arboard = { version = "3", default-features = false }
cpal = "0.16"
base64 = "0.22"
opus1 = "0.3"
nnnoiseless = { version = "0.5.2", default-features = false }
socket2 = { version = "0.5", features = ["all"] }
dav-server = "=0.11.0"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
percent-encoding = "2"

[target.'cfg(target_os = "macos")'.dependencies]
# The menu bar: Quit, and Edit so ⌘C/⌘V reach the page.
muda = { version = "0.21", default-features = false }
# Native screen share: macOS's own ScreenCaptureKit captures and VideoToolbox
# encodes. Their calls are written out in src/capture/macos.rs; these are the
# Objective-C runtime and blocks bindings Portside already ships (through tao
# and wry).
# (Messages are written by hand there, so the debug-build type checks are off.)
objc2 = { version = "0.6", features = ["disable-encoding-assertions"] }
block2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
# Native screen share: Windows' own Graphics Capture, a hardware H.264 encoder
# through Media Foundation, and WASAPI process loopback for the sound. The same
# Microsoft bindings Portside already ships (through wry's WebView2), with more
# of Windows' APIs switched on. (Imaging and Xps: the picker's previews,
# with the Windows Imaging Component's JPEG/PNG and PrintWindow.)
windows = { version = "0.62", features = [
    "Foundation",
    "Graphics",
    "Graphics_Capture",
    "Graphics_DirectX",
    "Graphics_DirectX_Direct3D11",
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Imaging",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    "Win32_Security",
    "Win32_Storage_Xps",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Ole",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_System_WinRT_Direct3D11",
    "Win32_System_WinRT_Graphics_Capture",
    "Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
